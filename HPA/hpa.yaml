# ============================================================
# HPA policy overview
# ============================================================
# Services with HPA enabled:
#   - adservice (minimum pods: 1, maximum pods: 2)
#   - cartservice (minimum pods: 2, maximum pods: 3)
#   - checkoutservice (minimum pods: 1, maximum pods: 2)
#   - currencyservice (minimum pods: 2, maximum pods: 4)
#   - emailservice (minimum pods: 1, maximum pods: 2)
#   - frontend (minimum pods: 2, maximum pods: 6)
#   - paymentservice (minimum pods: 2, maximum pods: 3)
#   - productcatalogservice (minimum pods: 2, maximum pods: 3)
#   - recommendationservice (minimum pods: 1, maximum pods: 5)
#   - shippingservice (minimum pods: 1, maximum pods: 2)
# ============================================================
# HPA behavior
# ============================================================
# Scale up:
#   - no stabilization window
#   - scale up by 1 pod per 60 seconds
#
# Scale down:
#   - stabilization window: 300 seconds
#   - scale down by 1 pod per 60 seconds
#
# Target metric:
#   - CPU averageUtilization = 70% for all services
# ============================================================

# ---------------------------
# Frontend 
# ---------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

---
