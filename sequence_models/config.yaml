fastStorage_config:
  fastStorage_patern: "data/fastStorage/*.csv"
  features: [
    "timestamp",
    "hour",
    "minute",
    "day_of_week",
    "month",
    "cpu_avg",
    "mem_avg"
  ]
  multi_features: [
    "hour",
    "day_of_week",
    "cpu_avg",
    "mem_avg"    
  ]
  single_feature: ["cpu_avg"]
  target_col: "cpu_avg"

prometheus_config:
  url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  feature_count: 12
  features: [
    "timestamp",
    "hour", 
    "minute", 
    "day_of_week", 
    "month",
    "cpu", 
    "cpu_percent",
    "memory_bytes", 
    "memory_percent",
    "desired_replicas", 
    "available_replicas",
    "deployment_id"
  ]
  single_feature: ["cpu_percent"]
  multi_features: [
      "hour",
      "day_of_week",
      "cpu_percent",
  ]
  multi_features_mem: [
      "hour",
      "day_of_week",
      "cpu_percent",
      "memory_percent",
  ]
  target_col: "cpu_percent"

