# prometheus collector 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequence-prometheus-collector
  labels:
    app-group: sequence
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sequence-prometheus-collector
  template:
    metadata:
      labels:
        app: sequence-prometheus-collector
    spec:
      serviceAccountName: autoscaler-sa
      containers:
        - name: sequence-prometheus-collector
          image: sequence-autoscaler:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "prometheus_collector.py"]
          env:       
            - name: TZ
              value: "Europe/Bratislava"
            - name: MODEL
              value: "hybrid"
          resources:
            requests:
              cpu: "400m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          volumeMounts:
            - name: sequence-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: usb-logs
              mountPath: /app/logs
      volumes:
        - name: sequence-config
          configMap:
            name: sequence-config
        - name: usb-logs
          hostPath:
            path: /mnt/data/logs
            type: DirectoryOrCreate            