---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-predict
  labels:
    app-group: sequence
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hybrid-predict
  template:
    metadata:
      labels:
        app: hybrid-predict
    spec:
      serviceAccountName: autoscaler-sa
      containers:
        - name: fortune-teller
          image: sequence-autoscaler:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main_prediction.py"]
          env:
            - name: SAVE_DIR
              value: "/app/logs/hybrid"          
            - name: TZ
              value: "Europe/Bratislava"
            - name: MODEL
              value: "hybrid"
            - name: LOG_FILE
              value: "/app/logs/hybrid_predictions.log"
            - name: SLEEP_TIME
              value: "1"              
          resources:
            requests:
              cpu: "400m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          volumeMounts:
            - name: sequence-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: scaling-config
              mountPath: /app/config-scaling.yaml
              subPath: config-scaling.yaml              
            - name: usb-logs
              mountPath: /app/logs
      volumes:
        - name: sequence-config
          configMap:
            name: sequence-config
        - name: scaling-config
          configMap:
            name: scaling-config      
        - name: usb-logs
          hostPath:
            path: /mnt/data/logs
            type: DirectoryOrCreate
